feature:
  name: Bark Signet rail
  description: >
    Public-Signet Bark receive, sync, and spendable balance. Bark sats are their
    own figure. They are not added to the on-chain total or the Arkade total.
  user_stories:
    - As a user with Bark enabled on signet, I want the dashboard to show my Bark spendable balance on its own card
    - As a user, I want a failed Bark sync to keep the last shown spendable amount and show the rail sync error
    - As a user, I want Bark to sync after unlock, from the Sync control, and on the same periodic interval policy as the other rails
  requirements:
    - The card is visible only when isBarkEnabled and the app network is signet
    - Spendable sats are read only after a successful Bark sync in this session
    - A failed sync does not replace the last shown spendable amount
    - The first failed sync of a session shows the error banner and no amount
    - lastSuccessfulSyncAt is stamped in encrypted barkRail metadata only after Wallet sync succeeds
    - Periodic sync for Bark follows the master toggle, the per-rail switch, signet, and tab visibility
  contracts:
    dashboard:
      - id: DASH-BARK-01
        description: When isBarkEnabled and the network is signet, the dashboard shows the Bark balance card
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-02
        description: When Bark is disabled or the network is not signet, the Bark balance card is not rendered
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-03
        description: After a successful sync, the card shows spendable sats at dashboard-bark-balance-amount
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-04
        description: The Bark card does not render the on-chain or Arkade balance amounts
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-05
        description: A sync error keeps a previously shown spendable amount and shows the Bark sync error banner
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-06
        description: The first sync error of a session shows the banner and no spendable amount
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
    sync:
      - id: BARK-SYNC-01
        description: bark_balance is refused until this session has completed a successful sync
        implemented_by: bitboard-bark/src/sync_gate.rs
      - id: BARK-SYNC-02
        description: A failed sync leaves the in-memory spendable amount unchanged and does not require a new stamp
        implemented_by: frontend/src/lib/wallet/lifecycle/__tests__/bark-sync-lifecycle-orchestrator.test.ts
      - id: BARK-SYNC-03
        description: A successful load starts a Bark sync without blocking unlock
        implemented_by: frontend/src/lib/wallet/lifecycle/__tests__/bark-load-lifecycle-orchestrator.test.ts
      - id: BARK-SYNC-04
        description: >
          Periodic Bark sync stays off unless the master toggle, the Bark rail, the Bark feature,
          signet, and a visible tab all apply
        implemented_by: frontend/src/lib/wallet/periodic-sync/__tests__/resolve-periodic-sync-refetch-interval.test.ts
    metadata:
      - id: BARK-META-01
        description: A successful sync stamp keeps the fingerprint and receive index and writes an ISO timestamp
        implemented_by: frontend/src/lib/bark/__tests__/bark-rail-metadata.test.ts
      - id: BARK-META-02
        description: Stamping is refused when the Bark rail is missing or the timestamp is not ISO-8601
        implemented_by: frontend/src/lib/bark/__tests__/bark-rail-metadata.test.ts
    settings:
      - id: BARK-PER-01
        description: The periodic sync card shows a Bark row only when isBarkEnabled
        implemented_by: frontend/src/routes/__tests__/settings.test.tsx
