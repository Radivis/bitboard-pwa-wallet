        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-13
        description: >
          When Bark session open fails, the dashboard card shows the embedded Bark session error
          screen, including the sanitized message and Retry
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-14
        description: >
          After a sync that reported a next refresh height, the dashboard card shows the next refresh
