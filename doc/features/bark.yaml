feature:
  name: Bark Signet rail
  description: >
    Public-Signet Bark receive, sync, spendable balance, boarding from the
    on-chain wallet, and fund-movement history. Bark sats are their own figure.
    They are not added to the on-chain total or the Arkade total.
  user_stories:
    - As a user with Bark enabled on signet, I want the dashboard to show my Bark spendable balance on its own card
    - As a user, I want a failed Bark sync to keep the last shown spendable amount and show the rail sync error
    - As a user, I want Bark to sync after unlock, from the Sync control, and on the same periodic interval policy as the other rails
    - As a user with Bark enabled on signet, I want to board an amount from my on-chain wallet into Bark
    - As a user, I want a failed board to leave my on-chain wallet unspent
    - As a user, I want Bark fund movements on the activity list, including failed movements that still changed funds
  requirements:
    - The card is visible only when isBarkEnabled and the app network is signet
    - Spendable sats are read only after a successful Bark sync in this session
    - A failed sync does not replace the last shown spendable amount
    - The first failed sync of a session shows the error banner and no amount
    - lastSuccessfulSyncAt is stamped in encrypted barkRail metadata only after Wallet sync succeeds
    - Periodic sync for Bark follows the master toggle, the per-rail switch, signet, and tab visibility
    - Board from on-chain is offered only when isBarkEnabled and the network is signet
    - Confirm signs the reviewed PSBT and submits it to Bark. It does not broadcast through the on-chain Esplora client
    - A failed board submission does not apply the funding transaction to the on-chain wallet
    - Boarding does not change the stored receive key index
    - Spendable Bark balance updates after confirmations and a later Bark sync
    - Activity includes Bark movements only when isBarkEnabled and the network is signet
    - A movement row shows its status and its signed effective balance
  contracts:
    dashboard:
      - id: DASH-BARK-01
        description: When isBarkEnabled and the network is signet, the dashboard shows the Bark balance card
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-02
        description: When Bark is disabled or the network is not signet, the Bark balance card is not rendered
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-03
        description: After a successful sync, the card shows spendable sats at dashboard-bark-balance-amount
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-04
        description: The Bark card does not render the on-chain or Arkade balance amounts
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-05
        description: A sync error keeps a previously shown spendable amount and shows the Bark sync error banner
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-06
        description: The first sync error of a session shows the banner and no spendable amount
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
    sync:
      - id: BARK-SYNC-01
        description: bark_balance is refused until this session has completed a successful sync
        implemented_by: bitboard-bark/src/sync_gate.rs
      - id: BARK-SYNC-02
        description: A failed sync leaves the in-memory spendable amount unchanged and does not require a new stamp
        implemented_by: frontend/src/lib/wallet/lifecycle/__tests__/bark-sync-lifecycle-orchestrator.test.ts
      - id: BARK-SYNC-03
        description: A successful load starts a Bark sync without blocking unlock
        implemented_by: frontend/src/lib/wallet/lifecycle/__tests__/bark-load-lifecycle-orchestrator.test.ts
      - id: BARK-SYNC-04
        description: >
          Periodic Bark sync stays off unless the master toggle, the Bark rail, the Bark feature,
          signet, and a visible tab all apply
        implemented_by: frontend/src/lib/wallet/periodic-sync/__tests__/resolve-periodic-sync-refetch-interval.test.ts
    metadata:
      - id: BARK-META-01
        description: A successful sync stamp keeps the fingerprint and receive index and writes an ISO timestamp
        implemented_by: frontend/src/lib/bark/__tests__/bark-rail-metadata.test.ts
      - id: BARK-META-02
        description: Stamping is refused when the Bark rail is missing or the timestamp is not ISO-8601
        implemented_by: frontend/src/lib/bark/__tests__/bark-rail-metadata.test.ts
    settings:
      - id: BARK-PER-01
        description: The periodic sync card shows a Bark row only when isBarkEnabled
        implemented_by: frontend/src/routes/__tests__/settings.test.tsx
    boarding:
      - id: BARK-BOARD-01
        description: The Bark balance card links to Board from on-chain when Bark is enabled on signet
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: BARK-BOARD-02
        description: The board link is absent when Bark is disabled or the network is not signet
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: BARK-BOARD-03
        description: The board page is not a funding form unless Bark is enabled on signet
        implemented_by: frontend/src/pages/wallet/__tests__/BarkBoardPage.test.tsx
      - id: BARK-BOARD-04
        description: Review shows the on-chain fee, the Bark board fee, and the net VTXO before confirm
        implemented_by: frontend/src/pages/wallet/__tests__/BarkBoardPage.test.tsx
      - id: BARK-BOARD-05
        description: Confirm signs the reviewed PSBT and submits it to Bark, and does not broadcast via Esplora
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-board.test.ts
      - id: BARK-BOARD-06
        description: A failed board submission does not apply the funding transaction and does not toast success
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-board.test.ts
      - id: BARK-BOARD-07
        description: Boarding does not write the stored receive key index
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-board.test.ts
      - id: BARK-BOARD-08
        description: The board fee is estimated before a new VTXO key is derived
        implemented_by: frontend/src/lib/bark/__tests__/review-bark-board.test.ts
    history:
      - id: BARK-HIST-01
        description: A history payload maps to movement rows with status and signed balance
        implemented_by: frontend/src/lib/bark/__tests__/bark-history.test.ts
      - id: BARK-HIST-02
        description: Dashboard activity includes Bark movements, newest first, when Bark is on signet
        implemented_by: frontend/src/lib/lightning/__tests__/lightning-dashboard-sync.test.ts
      - id: BARK-HIST-03
        description: Bark movements are omitted when Bark is disabled or the network is not signet
        implemented_by: frontend/src/pages/wallet/__tests__/DashboardPage.arkade.test.tsx
      - id: BARK-HIST-04
        description: A movement row shows status and the signed effective amount, including failures
        implemented_by: frontend/src/components/__tests__/BarkMovementItem.test.tsx
