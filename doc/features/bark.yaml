feature:
  name: Bark Signet rail
  description: >
    Public-Signet Bark receive, sync, spendable balance, boarding from the
    on-chain wallet, collaborative exit back to that wallet, emergency exit
    through Bark's exit manager, fund-movement history, and a VTXO list. Bark
    sats are their own figure. They are not added to the on-chain total or the
    Arkade total.
  user_stories:
    - As a user with Bark enabled on signet, I want the dashboard to show my Bark spendable balance on its own card
    - As a user, I want a failed Bark sync to keep the last shown spendable amount and show the rail sync error
    - As a user, I want Bark to sync after unlock, from the Sync control, and on the same periodic interval policy as the other rails
    - As a user with Bark enabled on signet, I want to board an amount from my on-chain wallet into Bark
    - As a user, I want a failed board to leave my on-chain wallet unspent
    - As a user, I want Bark fund movements on the activity list, including failed movements that still changed funds
    - As a user with Bark enabled on signet, I want to exit a chosen amount, or my whole spendable Bark balance, to my current on-chain receive address
    - As a user, I want a failed or parked Bark exit to leave the page without a success message
    - As a user with Bark enabled on signet, I want to open a VTXO list from wallet management and see each coin's Bark state
    - As a user with Bark enabled on signet, I want to send to a Bark Ark address from the send form
    - As a user with Bark enabled on signet, I want an emergency-exit control page where I can exit selected spendable VTXOs or the whole wallet, watch each coin's exit state, progress it, cancel while Bark still allows it, and claim claimable coins to my current on-chain receive address
    - As a user, I want a failed emergency-exit step to leave the page without a success message
    - As a user on the emergency-exit page, I want to see the exit transaction tree for the VTXOs I selected and for exits already in progress
  requirements:
    - The card is visible only when isBarkEnabled and the app network is signet
    - Spendable sats are read only after a successful Bark sync in this session
    - A failed sync does not replace the last shown spendable amount
    - The first failed sync of a session shows the error banner and no amount
    - lastSuccessfulSyncAt is stamped in encrypted barkRail metadata only after Wallet sync succeeds
    - Periodic sync for Bark follows the master toggle, the per-rail switch, signet, and tab visibility
    - Board from on-chain is offered only when isBarkEnabled and the network is signet
    - Confirm signs the reviewed PSBT and submits it to Bark. It does not broadcast through the on-chain Esplora client
    - A failed board submission does not apply the funding transaction to the on-chain wallet
    - Boarding does not change the stored receive key index
    - Spendable Bark balance updates after confirmations and a later Bark sync
    - Activity includes Bark movements only when isBarkEnabled and the network is signet
    - A movement row shows its status and its signed effective balance
    - Collaborative exit is offered only when isBarkEnabled and the network is signet
    - The destination is the current on-chain receive address. The page does not accept a pasted address and does not reveal a new one
    - Review shows the server fee and the on-chain amount before confirm
    - Confirm submits the exit to Bark. It does not broadcast through the on-chain Esplora client
    - A parked exit stays pending and continues on the next Bark sync
    - A bark.offboard movement is labeled as a Bark exit
    - The VTXO list link and page exist only when isBarkEnabled and the network is signet
    - The VTXO list is the local Bark database. It is not an operator snapshot
    - Spent and Exited VTXOs stay hidden until the user shows them. Locked VTXOs stay visible
    - A VTXO card shows id, amount, state, lock holder when the coin is locked, expiry height, and Registered only when the coin is registered
    - Search, state chips, sort, and pagination filter the loaded list and do not call the worker again
    - A Signet Bark policy address (tark1p) is a valid send recipient when isBarkEnabled and the network is signet
    - An Arkade address is not a Bark destination, and a Bark policy address is not an Arkade destination
    - A successful Arkoor send syncs and replaces the shown Bark spendable amount
    - A failed Arkoor send leaves the shown Bark spendable amount unchanged
    - The emergency-exit link and page exist only when isBarkEnabled and the network is signet
    - Emergency exit does not call send_onchain or offboard_all
    - Review, before start, shows the broadcast fee, the later claim fee, and how many transactions must be broadcast
    - Emergency exit broadcast, Pay-to-Anchor children, and the claim use the app Signet High fee preset from the on-chain Esplora, not Bark's own fast rate
    - Start stays disabled when the on-chain confirmed balance is below the broadcast fee
    - Progress is a button. It is not part of unlock sync or the periodic Bark sync
    - Cancel is offered only while that exit is still cancelable
    - Claim sends every claimable exit to the current on-chain receive address, broadcasts that signed transaction through the existing Esplora client, and does not reveal a new address
    - A bark.exit movement is labeled as a Bark emergency exit, distinct from collaborative bark.offboard
    - The exit tree is shown on the Signet emergency-exit page when Bark is enabled. It loads the checked spendable VTXOs, or every spendable VTXO when the whole wallet is checked, plus every live exit
    - After Start clears the checkboxes, live exits keep the exit tree on screen
    - The exit tree has one node per exit transaction. A txid shared by two VTXOs is one node. An input that spends a transaction outside the tree is not a node
    - A node is pending, in progress, or confirmed. Needs a child appears only while that transaction is waiting for a Pay-to-Anchor child. That child is not a node
    - Focusing a node shows its transaction id and the VTXO ids whose exit leaf is that transaction
    - Rendering the exit tree does not start, progress, cancel, or claim
  contracts:
    dashboard:
      - id: DASH-BARK-01
        description: When isBarkEnabled and the network is signet, the dashboard shows the Bark balance card
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-02
        description: When Bark is disabled or the network is not signet, the Bark balance card is not rendered
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-03
        description: After a successful sync, the card shows spendable sats at dashboard-bark-balance-amount
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-04
        description: The Bark card does not render the on-chain or Arkade balance amounts
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-05
        description: A sync error keeps a previously shown spendable amount and shows the Bark sync error banner
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-06
        description: The first sync error of a session shows the banner and no spendable amount
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
    sync:
