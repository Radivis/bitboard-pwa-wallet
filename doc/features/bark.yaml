        implemented_by: frontend/src/lib/bark/__tests__/bark-history.test.ts
      - id: BARK-EXIT-10
        description: A non-Signet address is rejected before an offboard starts
        implemented_by: bitboard-bark/src/exit_address.rs
      - id: BARK-EXIT-11
        description: A new pending offboard checkpoint is reported as parked; an older checkpoint is not
        implemented_by: bitboard-bark/src/exit_address.rs
    vtxo_list:
