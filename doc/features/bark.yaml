        implemented_by: frontend/src/components/wallet/__tests__/BarkPanel.test.tsx
      - id: BARK-VTX-02
        description: The VTXO page is not the inventory unless Bark is enabled on signet
        implemented_by: frontend/src/pages/wallet/__tests__/BarkVtxoViewerPage.test.tsx
      - id: BARK-VTX-03
        description: A card shows id, amount, state, expiry height, a lock-holder line when locked, and Registered only when true
        implemented_by: frontend/src/components/bark/__tests__/BarkVtxoCard.test.tsx
      - id: BARK-VTX-04
        description: Hide spent and exited defaults on, and the toggle shows those cards
        implemented_by: frontend/src/pages/wallet/__tests__/BarkVtxoViewerPage.test.tsx
      - id: BARK-VTX-05
        description: Search matches a partial id or a sats amount
        implemented_by: frontend/src/lib/bark/__tests__/bark-vtxo-viewer-display.test.ts
      - id: BARK-VTX-06
        description: State chips filter the grid, and counts come from the full list
        implemented_by: frontend/src/pages/wallet/__tests__/BarkVtxoViewerPage.test.tsx
      - id: BARK-VTX-07
        description: Pagination shows 20 cards per page
        implemented_by: frontend/src/pages/wallet/__tests__/BarkVtxoViewerPage.test.tsx
    send:
      - id: BARK-SEND-01
        description: A peeked Signet Bark receive address is a Bark send destination and is not an Arkade address
        implemented_by: frontend/src/lib/bark/__tests__/send-flow-validation.test.ts
      - id: BARK-SEND-02
        description: A Bark send validates, estimates, sends, then syncs and reads the new spendable balance
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-arkoor-send.test.ts
    emergency_exit:
      - id: BARK-EMG-01
        description: Management shows Emergency exit only when Bark is on and the network is signet
        implemented_by: frontend/src/components/wallet/__tests__/BarkPanel.test.tsx
      - id: BARK-EMG-02
        description: The emergency-exit page is not the control surface unless Bark is enabled on signet
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-03
        description: Review shows the broadcast fee, the claim fee, and the transaction count before start
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-04
        description: Start marks the selected VTXOs, or the whole wallet, and does not offboard
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-05
