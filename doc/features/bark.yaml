        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-board.test.ts
      - id: BARK-BOARD-07
        description: Boarding does not write the stored receive key index
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-board.test.ts
      - id: BARK-BOARD-08
        description: The board fee is estimated before a new VTXO key is derived
        implemented_by: frontend/src/lib/bark/__tests__/review-bark-board.test.ts
    history:
