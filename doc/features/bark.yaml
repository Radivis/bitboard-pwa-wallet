        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-15
        description: When exiting sats are above zero, the card shows an Exiting sub-line, and the headline stays spendable plus locked
        implemented_by: frontend/src/components/wallet/__tests__/BarkDashboardBalance.test.tsx
      - id: DASH-BARK-16
