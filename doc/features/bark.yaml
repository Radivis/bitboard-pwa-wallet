        implemented_by: frontend/src/pages/wallet/__tests__/BarkVtxoViewerPage.test.tsx
      - id: BARK-SESS-05
        description: >
          The first open of an empty envelope does not save a Bark record when seed recovery fails
          or leaves unchecked ids. Retry opens that same empty envelope and scans again. A finished
          scan, including one that only leaves ids past the key gap, saves the record
        implemented_by: bitboard-bark/src/recovery_open.rs
    sync:
      - id: BARK-SYNC-01
        description: bark_balance is refused until this session has completed a successful sync
        implemented_by: bitboard-bark/src/sync_gate.rs
      - id: BARK-SYNC-02
