        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-exit.test.ts
      - id: BARK-EXIT-07
        description: A failed exit does not sync Bark or start an on-chain sync and does not toast success
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-exit.test.ts
      - id: BARK-EXIT-08
