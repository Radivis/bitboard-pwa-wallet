      - id: BARK-DUR-02
        description: >
          That flush does not change lastSuccessfulSyncAt. A CAS conflict re-reads and keeps the
          other network's record envelope and the pending emergency claim.
        implemented_by: frontend/src/workers/__tests__/bark-protocol-state-flush.test.ts
