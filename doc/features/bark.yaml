        implemented_by: frontend/src/pages/wallet/__tests__/BarkExitPage.test.tsx
      - id: BARK-EXIT-05
        description: Confirm sends the reviewed amount to the current receive address at the reviewed fee rate and does not reveal a new address or broadcast via Esplora
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-exit.test.ts
      - id: BARK-EXIT-06
