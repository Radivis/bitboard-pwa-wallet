        implemented_by: frontend/src/lib/wallet/periodic-sync/__tests__/resolve-periodic-sync-refetch-interval.test.ts
      - id: BARK-SYNC-05
        description: >
          A refresh warning after a successful sync keeps the spendable amount and does not set the rail sync error
        implemented_by: frontend/src/lib/wallet/lifecycle/__tests__/bark-sync-lifecycle-orchestrator.test.ts
      - id: BARK-SYNC-06
        description: Pending rounds skip scheduling another delegated refresh
        implemented_by: bitboard-bark/src/refresh.rs
      - id: BARK-SYNC-07
        description: >
          A mailbox, pending-Arkoor, pending-round, or board error fails bark_sync,
          does not mark the session synced, and does not refresh the shown spendable amount
        implemented_by: bitboard-bark/src/required_sync.rs
      - id: BARK-SYNC-08
        description: >
          The next refresh schedule reports the first block at which Bark must refresh (required
          height plus one) and the chain tip, or null when either is unknown
        implemented_by: bitboard-bark/src/refresh.rs
      - id: BARK-SYNC-09
        description: >
          A successful sync stores the next refresh schedule. A failed sync keeps it. Lock, wallet
          switch, and session open clear it
        implemented_by: frontend/src/lib/wallet/lifecycle/__tests__/bark-sync-lifecycle-orchestrator.test.ts
      - id: BARK-SYNC-10
        description: >
          The hint names an approximate unlock time when the next refresh height is ahead of the tip,
          and asks to stay unlocked when the refresh period has started
        implemented_by: frontend/src/lib/bark/__tests__/bark-next-refresh-hint.test.ts
      - id: BARK-SYNC-11
        description: >
          A confirmed foreign spend of one output of an anchor transaction, by any transaction other
          than the first exit transaction of the branch through that output, is an anchor sweep. It
          records every unspent VTXO on that branch, with the spending transaction id, and marks
          those coins spent before refresh is
          scheduled. Renewal cannot restore them. The scan checks each output of an anchor
          transaction on its own, before hops. Only the branch through the swept output is left out
          of the hop seizure check. A branch through another output of the same anchor transaction
          is still checked. A confirmed foreign spend of one output of a hot exit hop
          records every remaining unspent VTXO whose history continues through that output as spent,
          before refresh is scheduled, and names the spent node as a checkpoint, a leaf, or an
          internal node, and records the spending transaction id. A history can appear as more
          than one item. Two spends of the same kind stay two items, distinguished by that
          transaction. Another output of the same transaction is not recorded. A hop whose next
          exit transaction is already confirmed is not watched, and the VTXO outpoint is not
          watched. The wallet layout shows one banner. Each kind is a section whose warning names
          Bark VTXOs and lists its VTXO ids, each followed by the spending transaction id when one
          was recorded. Every section with ids shows together. The Bark account stores one array
          of items, each with a VTXO id, a node kind, and the spending transaction id. An item
          saved before that id existed still shows the kind. A later sync appends items and leaves
          the others in place. A sync that records nothing removes nothing. Dismissing a section
          removes only that kind. Lock, wallet switch, and session change hide the banner until
          that wallet is unlocked again
        implemented_by:
          - bitboard-bark/src/exit_seizure.rs
          - frontend/src/lib/bark/__tests__/bark-rail-metadata.test.ts
          - frontend/src/lib/wallet/lifecycle/__tests__/bark-sync-lifecycle-orchestrator.test.ts
          - frontend/src/lib/wallet/lifecycle/__tests__/bark-load-lifecycle-orchestrator.test.ts
          - frontend/src/lib/bark/__tests__/bark-exit-seizure.test.ts
          - frontend/src/lib/bark/__tests__/bark-exit-seizure-notice.test.ts
          - frontend/src/components/bark/__tests__/BarkExitSeizureBanner.test.tsx
      - id: BARK-SYNC-12
        description: >
          A coin is inside Bark's must-refresh expiry window once the tip is past
          expiry minus the refresh threshold, including a coin that is already expired
        implemented_by: bitboard-bark/src/refresh.rs
      - id: BARK-SYNC-13
        description: >
          Dust consolidation is scheduled only from an idle maintenance refresh, and only
          when the dust total meets the VTXO dust minimum. A refresh fee that leaves a
          sub-dust output stays idle. Any other schedule error warns
        implemented_by: bitboard-bark/src/refresh.rs
