feature:
  name: Bark
  description: "Second's Bark Ark rail on public Signet, beside Arkade. Protocol state stays in Bark's IndexedDB."
  user_stories:
    - As a user, I want to receive on a Bark Ark address when Bark is enabled and the wallet is on signet
    - As a user, I want that address to stay the same across reload, lock, and opening Receive again until I generate a new one
  requirements:
    - Bark receive is shown only when isBarkEnabled is on and the network mode is signet
    - The mnemonic stays on the secrets channel. Receive calls peek or reveal on bark.worker
    - peek_address uses the receiveKeyIndex stored on the encrypted barkRail. That index is not Bark's last VTXO key, because change keys share that sequence
    - new_address runs on the first session open when Bark has no VTXO key yet, and when the user generates a new address
    - A session open that finds a VTXO key but no stored index persists that key's index and does not reveal another
    - Render, reopen, and unlock do not reveal when an index or an existing key is already there
    - The receive screen does not poll balance, show a faucet, or list history
  contracts:
    receive_address:
      - id: BARK-RCV-01
        description: Receive shows the address for the stored receiveKeyIndex. Rendering Receive calls peek and does not call reveal
      - id: BARK-RCV-02
        description: Leaving Receive and opening it again does not call reveal
      - id: BARK-RCV-03
        description: Unlock when a receiveKeyIndex is stored, or when a VTXO key exists and the index is missing, does not call reveal
      - id: BARK-RCV-04
        description: The first session open when Bark has no VTXO key calls reveal once and persists that index
      - id: BARK-RCV-05
        description: Generate new address is the only Receive control that calls reveal, and the new address replaces the previous one
      - id: BARK-RCV-06
        description: The Bark segment is absent when the flag is off or the network is not signet. Bitcoin and Arkade receive are unchanged
  pages:
    - WalletReceiveBarkMode:
      - description: "Bark receive on the main Receive page"
      - file: frontend/src/pages/wallet/ReceivePage.tsx
      - path: /wallet/receive
      - visible_elements:
        - Receive mode toggle includes Bark when isBarkEnabled and the network mode is signet
        - QR code of the raw Bark address (tark1…, not a bitcoin: URI)
        - Bark receiving address text with copy
        - Generate new address button
      - requirements:
        - Contracts BARK-RCV-01 through BARK-RCV-06
        - Default receive mode stays Bitcoin
        - Copy explains this is Second's public Signet Ark address, separate from the on-chain address and from Arkade
