        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-emergency-exit.test.ts
      - id: BARK-EMG-06
        description: Cancel is absent unless that exit is cancelable
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-07
        description: Claim drains to the current receive address and broadcasts the signed transaction
        implemented_by: frontend/src/lib/bark/__tests__/perform-bark-emergency-exit.test.ts
      - id: BARK-EMG-08
        description: A failed start, progress, CPFP, or claim does not toast success
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-09
        description: A bark.exit movement is labeled Bark emergency exit
        implemented_by: frontend/src/lib/bark/__tests__/bark-history.test.ts
      - id: BARK-EMG-10
        description: The exit tree loads the checked spendable VTXOs, or every spendable VTXO when the whole wallet is checked, plus every live exit, and stays after Start clears the checkboxes
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-11
        description: One node per exit transaction. A shared txid is one node. An input outside the chain is not a node
        implemented_by: bitboard-bark/src/emergency_exit.rs
      - id: BARK-EMG-12
        description: A node is pending, in progress, or confirmed. Needs a child appears only for AwaitingCpfpBroadcast, and that child is not a node
        implemented_by: bitboard-bark/src/emergency_exit.rs
      - id: BARK-EMG-13
        description: Focusing a node shows its txid and the VTXO ids whose exit leaf is that transaction
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
      - id: BARK-EMG-14
        description: Rendering the exit tree does not start, progress, cancel, or claim
        implemented_by: frontend/src/pages/wallet/__tests__/BarkEmergencyExitPage.test.tsx
  pages:
    - BarkManagement:
        description: Bark entry on the Management page
        file: frontend/src/components/wallet/BarkPanel.tsx
        visible_elements:
          - List VTXOs link to /wallet/bark/vtxos
          - Emergency exit link to /wallet/bark/emergency-exit
        requirements:
          - Contract BARK-VTX-01
          - Contract BARK-EMG-01
          - Shown only when isBarkEnabled and the network is signet
    - BarkVtxoViewer:
        description: Bark VTXO inventory
        path: /wallet/bark/vtxos
        file: frontend/src/routes/wallet/bark/vtxos.tsx
        visible_elements:
          - VTXO card grid with id, amount, Bark state, expiry height, lock-holder line when locked, and Registered when registered
          - search by id or sats amount
          - state filter chips with counts from the full list
          - sort by amount or expiry height
          - hide spent and exited toggle, default on
          - pagination at 20 cards per page
          - last successful sync subtitle when a sync time is known
          - Bark sync error banner
          - Back to management
        requirements:
          - Contracts BARK-VTX-02 through BARK-VTX-07
          - Shown only when isBarkEnabled and the network is signet
          - The list is the local Bark database
    - BarkEmergencyExit:
        description: Bark emergency exit control
        path: /wallet/bark/emergency-exit
        file: frontend/src/routes/wallet/bark/emergency-exit.tsx
        visible_elements:
          - Exit tree for the checked spendable VTXOs, or every spendable VTXO when the whole wallet is checked, plus every live exit
          - A leaf node shows the leaf icon and a coin badge. A shared ancestor shows the tree icon and no coin badge. A confirmed leaf uses the unrolled coin icon
          - Focused exit-tree node shows its transaction id and the VTXO ids that end on it
          - Spendable VTXO checkboxes
          - Review of broadcast fee, claim fee, and transaction count
          - Start for the selection or the whole wallet
          - Live exit rows with state and Cancel when cancelable
          - Progress button
          - Claim section to the current on-chain receive address
          - Back to management
        requirements:
          - Contracts BARK-EMG-02 through BARK-EMG-08
          - Contracts BARK-EMG-10 through BARK-EMG-14
          - Shown only when isBarkEnabled and the network is signet
          - Progress is a button, not unlock or periodic sync
