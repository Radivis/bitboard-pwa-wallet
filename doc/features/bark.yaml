  pages:
    - BarkManagement:
        description: Bark entry on the Management page
        file: frontend/src/components/wallet/BarkPanel.tsx
        visible_elements:
          - Embedded Bark session loading or error screen while the session is not ready
          - Yellow next refresh hint at the top of the card content
          - Pending Bark action banner
          - List VTXOs link to /wallet/bark/vtxos
          - Emergency exit link to /wallet/bark/emergency-exit
        requirements:
          - Contract BARK-VTX-01
          - Contract BARK-VTX-08
          - Contract BARK-VTX-09
          - Contract BARK-EMG-01
          - Contracts BARK-SESS-01 and BARK-SESS-02
          - Shown only when isBarkEnabled and the network is signet or mainnet
    - BarkVtxoViewer:
        description: Bark VTXO inventory
        path: /wallet/bark/vtxos
        file: frontend/src/routes/wallet/bark/vtxos.tsx
        visible_elements:
          - VTXO card grid with id, amount, Bark state, blocks until expiry and an approximate date, a lock line that names the pending action or history label, Registered when registered, and a last line Emergency exit phase when the coin has a live exit, is claimed, or was swept or seized
          - search by id or sats amount
          - state filter chips with counts from the full list
          - sort by amount or expiry height
          - hide spent and exited toggle, default on, keeping a live emergency exit, an anchor-swept coin, and a checkpoint-seized coin listed
          - pagination at 20 cards per page
          - last successful sync subtitle when a sync time is known
          - Bark sync error banner
          - Full-page Bark session loading or error screen while the session is not ready
          - Back to management
        requirements:
          - Contracts BARK-VTX-02 through BARK-VTX-07
          - Contract BARK-VTX-10
          - Contracts BARK-SESS-03 and BARK-SESS-04
          - Shown only when isBarkEnabled and the network is signet or mainnet
          - The list is the local Bark database
    - BarkEmergencyExit:
        description: Bark emergency exit control
        path: /wallet/bark/emergency-exit
        file: frontend/src/routes/wallet/bark/emergency-exit.tsx
        visible_elements:
          - Exit tree for the checked spendable VTXOs, or every spendable VTXO when the whole wallet is checked, plus every live exit
          - Banner below the exit tree while some exit transactions are waiting for confirmed funds
          - A leaf node shows the leaf icon and a coin badge. A shared ancestor shows the tree icon and no coin badge. A checkpoint shows the checkpoint icon. The chain anchor shows the commitment icon. The leaf coin badge shows Coins before the leaf confirms, an Hourglass from its first confirmation (or awaitingDelta) while the exit timelock runs, and HandCoins once every exit on that leaf is claimable, the same three stages as the Arkade unilateral exit graph
          - Focused exit-tree node shows its transaction id and the VTXO ids that end on it
          - Spendable VTXO checkboxes
          - Fee rate selector (low / medium / high / custom) while Proceed automatically is off
          - Congestion warning, max fee rate, and low / medium / high presets while Proceed automatically is on
          - Proceed automatically switch in Live exits
          - Review emergency exit as the primary button in Start an exit
          - Start emergency exit only after Review emergency exit has produced a review
          - Review of broadcast fee, claim fee, and transaction count
          - Start for the selection or the whole wallet
          - Confirmation before start, with the loss-of-funds and fee risks, disabled until those risks are acknowledged
          - Live exit rows with state and Cancel when cancelable
          - Progress button
          - Claim section to the current on-chain receive address
          - Back to management
          - Full-page Bark session loading or error screen while the session is not ready
        requirements:
          - Contracts BARK-EMG-02 through BARK-EMG-08
          - Contracts BARK-EMG-10 through BARK-EMG-29
          - Contracts BARK-SESS-03 and BARK-SESS-04
          - Shown only when isBarkEnabled and the network is signet or mainnet
          - Progress is a button, and a successful Bark sync also progresses exits that are already started
          - Claim stays disabled while every claimable exit is already in a pending claim
