feature:
  name: Bark rail
  description: >
    Bark receive, sync, spendable balance, boarding from the on-chain wallet,
    collaborative exit back to that wallet, emergency exit through Bark's exit
    manager, fund-movement history, and a VTXO list, on public Signet and on
    Mainnet. Bark sats are their own figure. They are not added to the on-chain
    total or the Arkade total. Each network keeps its own encrypted record envelope.
  user_stories:
    - As a user with Bark enabled on signet or mainnet, I want the dashboard to show my Bark balance, including locked coins, on its own card
    - As a user, I want a newly activated wallet to show that wallet's Bark balance, not the previous wallet's balance or parked exit
    - As a user restoring a wallet from its seed, I want a failed Bark recovery scan to leave that network's record empty, so the next open scans the recovery mailbox again
    - As a user, I want a failed Bark sync to keep the last shown spendable and locked amounts and show the rail sync error
    - As a user with Bark enabled on signet or mainnet, I want a sync to schedule a delegated refresh when coins are due, and to see whether that refresh was scheduled, is still pending, or could not be scheduled, without losing the spendable amount
    - As a user with Bark enabled on signet or mainnet, I want to know when to unlock this wallet again so Bark can refresh my VTXOs, because Bark has no delegate that refreshes them while the wallet is locked
    - As a user, I want Bark to sync after unlock, from the Sync control, and on the same periodic interval policy as the other rails
    - As a user with Bark enabled on signet or mainnet, I want to board an amount from my on-chain wallet into Bark
    - As a user boarding into Bark, I want to choose the on-chain fee rate for the funding transaction before I confirm
    - As a user on mainnet with fiat denomination mode, I want Bark balances and board and exit amounts shown in my fiat currency
    - As a user, I want a failed board to leave my on-chain wallet unspent
    - As a user, I want Bark fund movements on the activity list, including failed movements that still changed funds
    - As a user, I want an on-chain Pay-to-Anchor fee bump to show a CPFP fee bump badge on the dashboard, so it is not mistaken for an empty payment
    - As a user with Bark enabled on signet or mainnet, I want to exit a chosen amount, or my whole spendable Bark balance, to my current on-chain receive address
    - As a user, I want a failed Bark exit to leave the page without a success message, and a parked exit to stay visible as a banner on the exit page, the dashboard, and management
    - As a user with Bark enabled on signet or mainnet, I want to open a VTXO list from wallet management and see each coin's Bark state
    - As a user, I want each Bark VTXO card to show how far that coin's emergency exit has gotten, including a started exit, the timelock after confirmation, and an anchor sweep or a seizure of a checkpoint, leaf, or internal node, with the spending transaction beside that node type
    - As a user with Bark enabled on signet or mainnet, I want to send to a Bark Ark address from the send form
    - As a user with Bark enabled on signet or mainnet, I want an emergency-exit control page where I can exit selected spendable VTXOs or the whole wallet, watch each coin's exit state, progress it, cancel while Bark still allows it, and claim claimable coins to my current on-chain receive address
    - As a user, I want a failed emergency-exit step to leave the page without a success message
    - As a user on the emergency-exit page, I want to see the exit transaction tree for the VTXOs I selected and for exits already in progress
  requirements:
    - The card is visible only when isBarkEnabled and the app network is signet
    - Spendable and locked sats are read only after a successful Bark sync in this session
    - Activating or switching to another wallet clears the previous wallet's Bark balance, sync time, and pending-action placeholder before that wallet's own Bark session is shown
    - A failed sync does not replace the last shown spendable or locked amount
    - When locked sats are above zero, the dashboard headline is spendable plus locked and shows those two sub-lines
    - On mainnet with fiat denomination mode and a usable Bitcoin price, Bark balance amounts and board and exit amount entry use that fiat currency. Signet stays in bitcoin even when fiat mode is on
    - Exiting sats are coins in an emergency exit. They are read with spendable and locked sats after a successful Bark sync and are never added to the dashboard headline
    - While a VTXO is in an emergency exit and Bark still lists it as spendable, it is locked to that exit's movement, so a send, a refresh, or a collaborative exit cannot select it. Cancel releases that lock. Once Bark marks the coin exited, that mark stays. An exit with no movement is not locked. Bark sync takes this lock before it refreshes coins, and start, progress, and exit sync take it as well
    - A send, a collaborative-exit review, or a refresh that cannot use coins because they are locked in an emergency exit says "This cannot succeed until you cancel the emergency exit." A send that still fits in spendable proceeds. Exit entire balance stays disabled when spendable is zero. That refresh warning is separate from a scheduling failure
    - When exiting sats are above zero, the card shows the sub-lines with an Exiting line, even when locked sats are zero. A zero locked amount has no Locked line
    - Sub-lines use the detail amount size, not the headline size
    - The first failed sync of a session shows the error banner and no amount
    - lastSuccessfulSyncAt is stamped on the open network's barkAccounts entry only after Wallet sync succeeds
    - Periodic sync for Bark follows the master toggle, the per-rail switch, signet or mainnet, and tab visibility
    - Board from on-chain is offered only when isBarkEnabled and the network is signet or mainnet
    - Confirm signs the reviewed PSBT and submits it to Bark. It does not broadcast through the on-chain Esplora client
    - Review lets the user pick the on-chain fee rate. Confirm signs the funding transaction built at that rate. Changing the rate does not derive another VTXO key
    - A failed board submission does not apply the funding transaction to the on-chain wallet
    - Boarding does not change the stored receive key index
    - Spendable Bark balance updates after confirmations and a later Bark sync
    - Activity includes Bark movements only when isBarkEnabled and the network is signet or mainnet
    - A movement row shows its status and its signed effective balance
    - Collaborative exit is offered only when isBarkEnabled and the network is signet or mainnet
    - The destination is the current on-chain receive address. The page does not accept a pasted address and does not reveal a new one
    - Review shows the server fee and the on-chain amount before confirm
    - Confirm submits the exit to Bark. It does not broadcast through the on-chain Esplora client
    - A parked exit stays pending, continues on the next Bark sync, and is shown as a banner rather than a toast
    - When the server rejects an exit input as already spent, that VTXO is recorded as spent and the offboard checkpoint is dropped, so a later exit cannot select it
    - A bark.offboard movement is labeled as a Bark exit
    - A bark.round movement whose kind is refresh is labeled Bark refresh, including a failed row
    - After Wallet sync succeeds, a delegated refresh is scheduled only when no round is already pending and Bark's selector finds coins that must refresh. When that selector stays idle, spendable dust coins are consolidated with one delegated refresh when their total covers the refresh fee and a non-dust output. A dust set that cannot pay stays idle and does not warn. A refresh fee that would leave a sub-dust output stays idle. Any other failure to schedule that consolidation uses the existing refresh warning. A pending round, a scheduled must-refresh, a scheduling warning, or coins locked in an emergency exit skips dust consolidation. The same notice covers a scheduled or pending consolidation
    - A scheduling failure keeps the last shown spendable amount and does not use the rail sync error banner
    - The Bark card shows a notice when a refresh was scheduled or is still pending, a warning when scheduling failed, and a separate warning when coins that must refresh are locked in an emergency exit
    - After a successful sync with spendable VTXOs, the dashboard Bark card and the management Bark card show a yellow notice at the top of the card content with the approximate time to unlock this wallet again
    - That time is the start of the next refresh period (Bark's next required refresh height), estimated from the sync time and the average block interval of the open network
    - When the refresh period has already started, the notice asks the user to keep the wallet unlocked and synced instead of naming a time
    - The notice covers only the open wallet and network. It is cleared on lock, wallet switch, and session change
    - A confirmed spend of one output of an anchor transaction, by any transaction other than the first exit transaction of the branch through that output, is an anchor sweep. It records every unspent VTXO on that branch, with the spending transaction id, and marks those coins spent before refresh is scheduled. The server already claimed that output after expiry, so renewal cannot restore them. The scan checks each output of an anchor transaction on its own, before hops. Only the branch through the swept output is left out of the hop seizure check. A branch through another output of the same anchor transaction is still checked
    - A confirmed spend of one output of a hot exit hop, when that output's next exit transaction is not yet confirmed, by any transaction other than that next exit transaction, records every remaining unspent VTXO whose history continues through that output as spent, before refresh is scheduled, and records the spending transaction id. The recorded kind is checkpoint, leaf, or internal node, from the hop that was spent. A history can be recorded under more than one kind when more than one of its hops was seized. Two spends of the same kind stay two items, distinguished by the spending transaction. Another output of the same transaction is not recorded. A hop whose next exit transaction is already confirmed is not watched. The VTXO outpoint itself is not watched
    - The wallet layout shows one banner. Each recorded kind is its own section. The warning names Bark VTXOs. The section lists its VTXO ids, and each id is followed by the spending transaction id when one was recorded. Every section with ids shows together. The Bark account stores one array of items, each with a VTXO id, a node kind of anchor, internal, leaf, or checkpoint, and the spending transaction id. An item saved before that id existed still shows the kind. Each sync appends newly recorded items and leaves the others in place. A sync that records nothing removes nothing. Dismissing a section removes only that kind. Lock, wallet switch, and session change hide the banner until that wallet is unlocked again
    - The VTXO list link and page exist only when isBarkEnabled and the network is signet or mainnet
    - The VTXO list is the local Bark database. It is not an operator snapshot
    - Spent and Exited VTXOs stay hidden until the user shows them, except a live emergency exit, an anchor-swept coin, and a coin seized at a checkpoint, leaf, or internal node, which stay listed. Locked VTXOs stay visible
    - A VTXO card shows id, amount, state, a lock line that names the pending action or history label, expiry as blocks remaining plus an approximate date, and Registered only when the coin is registered
    - A card ends with Emergency exit phase when the coin has a live exit, is claimed, or is named by an anchor sweep or a hop seizure. A coin with no exit omits that line. A sweep or seizure wins over a live exit. When more than one item names the coin, the phase prefers an internal node, then a leaf, then a checkpoint. The phase line names the full spending transaction id beside that node type when the winning item has one, and keeps the node type alone when the stored item has no transaction id. While processing, the copy is the frontier exit-tree phase, and it names how many non-anchor exit transactions are confirmed once one is. After confirmation, the copy is the timelock as blocks elapsed of the total. Until that exit tree has loaded, a processing coin reads processing
    - Search, state chips, sort, and pagination filter the loaded list and do not call the worker again
    - A Signet Bark policy address (tark1p) is a valid send recipient when isBarkEnabled and the network is signet
    - A Mainnet Bark policy address (ark1p) is a valid send recipient when isBarkEnabled and the network is mainnet
    - A tark1p address is not a Bark destination on mainnet, and an ark1p address is not a Bark destination on signet
    - A collaborative or emergency exit on mainnet accepts a mainnet on-chain address (bc1) and rejects a signet address (tb1) or mainnet
    - An Arkade address is not a Bark destination, and a Bark policy address is not an Arkade destination
    - A successful Arkoor send syncs and replaces the shown Bark spendable amount
    - A failed Arkoor send leaves the shown Bark spendable amount unchanged
    - The emergency-exit link and page exist only when isBarkEnabled and the network is signet or mainnet
    - Emergency exit does not call send_onchain or offboard_all
    - Emergency exit never contacts or waits for the Ark server. Review, start, progress, cancel, and claim work in a session whose Bark sync failed because the server is unreachable
    - Review, before start, shows the broadcast fee, the later claim fee, and how many transactions must be broadcast
    - While Proceed automatically is off, Review, Progress, and Claim use the fee rate selected on the page (low, medium, high, or custom sat/vB). Presets come from the open network's on-chain Esplora, not Bark's own fast rate
    - While Proceed automatically is on, each automatic progress resolves the saved low, medium, or high degree to the live Esplora preset, locks that sat/vB for that call, and pauses without broadcasting when the live rate exceeds the saved maximum or the step is unfundable. A partial funding wait does not pause. Claim uses that same resolved rate and does not broadcast while the fee-cap pause is active
    - After a successful Bark sync, already-started exits progress at the High preset while Proceed automatically is off, and use that same automatic fee lock while it is on
    - Start stays disabled when the on-chain confirmed balance is below the broadcast fee
    - Start asks for confirmation and stays disabled until the user acknowledges the loss-of-funds and on-chain fee risks. The exit is marked only after that confirmation
    - Progress is a button. After a successful Bark sync, already-started exits take that same path, including Pay-to-Anchor children
    - Cancel is offered only while that exit is still cancelable
    - A start that marks no VTXO is an error and does not toast success
    - Claim sends every fresh claimable exit to the current on-chain receive address, broadcasts that signed transaction through the existing Esplora client, and does not reveal a new address
    - The claim broadcast and the check whether a pending claim is visible use the Esplora configured for the network, which is the custom URL when one is set
    - A claim is finished only when Bark reports claim-in-progress or claimed for each drained VTXO. Until then those VTXOs stay claim-in-progress and are not drained again
    - A bark.exit movement is labeled as a Bark emergency exit, distinct from collaborative bark.offboard
    - The exit tree is shown on the emergency-exit page when Bark is enabled on signet or mainnet. It loads the checked spendable VTXOs, or every spendable VTXO when the whole wallet is checked, plus every live exit
    - After Start clears the checkboxes, live exits keep the exit tree on screen
    - The exit tree has one node per exit transaction, plus the chain anchor. A txid shared by two VTXOs is one node. An input that is neither an exit transaction nor that anchor is not a node
    - Each exit-tree node shows one phase. Not processing has no badge. Waiting for confirmed funds shows a spinner and a wallet icon. Waiting to broadcast the Pay-to-Anchor child shows a spinner and a megaphone. Waiting for confirmation shows a spinner and a pickaxe. Confirmed shows a check.
    - A checkpoint transaction shows the checkpoint icon and the Checkpoint label. Another non-leaf transaction shows the tree icon
    - The chain anchor shows the commitment icon and the Commitment label. It is confirmed unless a child is still waiting on it
    - Focusing a node shows its transaction id and the VTXO ids whose exit leaf is that transaction
    - Rendering the exit tree does not start, progress, cancel, or claim
    - A checkpoint, exit-row, or exit-child write exports and encrypts the open network's record envelope before that write returns
    - That mid-call flush does not change lastSuccessfulSyncAt
    - A record envelope taken at that flush, opened again, still has the board checkpoint, so the next sync can resume it
    - A flush failure fails that write. The end-of-call flush still runs when the session is open
    - The first open of an empty Bark record envelope does not save a Bark record when seed recovery fails or leaves unchecked VTXO ids. Retry opens that same empty envelope and scans again. A finished scan, including one that only leaves ids past the key gap, saves the record
