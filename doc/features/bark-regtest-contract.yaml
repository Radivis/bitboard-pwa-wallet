# Bark regtest contracts (local captaind on the arkade-regtest chain)
#
# Phase 1 implements E2E-BARK-REG-02 only.
# The other ids are the phase 2 list.
#
# Run: npm run test:e2e:bark-regtest (from frontend/)

contracts:
  - id: E2E-BARK-REG-01
    description: Enable Bark, unlock, peek a receive address, pay it, sync. Dashboard Bark spendable shows the payment. On-chain total and Arkade total stay unchanged.
    tags: ["@bark-regtest"]
    phase: 2
  - id: E2E-BARK-REG-02
    description: Board from the on-chain wallet. Review shows fees and the net VTXO. After confirmations and a Bark sync, spendable includes that VTXO and the on-chain total has dropped.
    tags: ["@bark-regtest"]
    phase: 1
    implemented_by: frontend/tests/e2e/bark-core-flows-regtest.spec.ts
  - id: E2E-BARK-REG-03
    description: Arkoor send to a second Bark wallet on the same server. Sender spendable drops. Recipient, after sync, shows the payment.
    tags: ["@bark-regtest"]
    phase: 2
  - id: E2E-BARK-REG-04
    description: Collaborative exit of part of the balance, and of the whole spendable balance, to the current on-chain receive address.
    tags: ["@bark-exit-regtest"]
    phase: 2
  - id: E2E-BARK-REG-05
    description: Emergency exit of a selected VTXO. Progress mines between steps. Claimed funds arrive on-chain.
    tags: ["@bark-exit-regtest"]
    phase: 2
  - id: E2E-BARK-REG-06
    description: Sync when coins are due for refresh. The dashboard shows the refresh notice and the spendable amount stays.
    tags: ["@bark-exit-regtest"]
    phase: 2

rust_invariants:
  - name: sync_fails_when_server_stopped_leaves_record_dump_unchanged
    description: refresh_server fails while captaind is stopped, and the record dump bytes stay the same.
    phase: 1
    test: bitboard-bark/tests/sync_while_server_stopped_regtest.rs
    run: BARK_REGTEST_RUN=1 cargo test --features regtest-support --test sync_while_server_stopped_regtest -- --ignored --test-threads=1
  - name: board_submission_rejected
    description: A rejected board leaves the on-chain inputs in place and writes no settled VTXO for that attempt.
    phase: 2
  - name: offboard_while_server_stopped
    description: Offboard fails while captaind is stopped. A later open of the same dump still has the pre-exit spendable VTXOs.
    phase: 2
  - name: exit_input_already_spent
    description: A VTXO the server names as already spent is recorded spent once, and the offboard checkpoint is dropped.
    phase: 2
  - name: emergency_exit_claim_before_observation
    description: Re-opening the dump after a claim broadcast does not drain those VTXOs again.
    phase: 2

infrastructure:
  stack: arkade-regtest
  profile: bark
  image: docker.io/secondark/captaind:0.7.1
  captaind: "http://localhost:3535"
  esplora: "http://localhost:7030/api"
  expiry:
    vtxo_lifetime: 4320
    vtxo_exit_delta: 144
    required_board_confirmations: 3
    min_board_amount_sats: 20000
  health_gate:
    - scripts/start-bark-regtest.sh funds the round wallet and waits for public RPC plus trusted coins
    - Playwright globalSetup when REQUIRE_BARK_REGTEST=1
    - REQUIRE_ARKADE_REGTEST=1 still runs, because the bark profile also starts arkd
  env_file: ../.env.regtest
