# Arkade regtest E2E contracts (live arkd via arkade-regtest)
#
# Run: npm run test:e2e:arkade-regtest (from frontend/)
# Requires: Docker, Node 24+, arkade-regtest submodule (regtest/)

contracts:
  - id: E2E-ARK-REG-01
    description: Recoverable VTXO banner appears after tree expiry; Recover now batch-settles back into Arkade balance
    tags: ["@arkade-regtest"]
  - id: E2E-ARK-REG-02
    description: Renew VTXOs now succeeds when VTXOs are near block-denominated expiry
    tags: ["@arkade-regtest"]
  - id: E2E-ARK-REG-03
    description: Collaborative exit withdraws part of Arkade balance to on-chain receive address
    tags: ["@arkade-regtest"]
  - id: E2E-ARK-REG-04
    description: Full unilateral unroll — select VTXO, per-step Proceed with mining, branch complete, mine timelock blocks, complete exit on-chain
    tags: ["@arkade-regtest"]
  - id: E2E-ARK-REG-07
    description: Chained self-sends (40% + 30%) — intermediate virtual txs show exitable outpoints but are not leaf-selectable; Proceed automatically on all terminal preconfirmed leaf siblings until branch complete
    tags: ["@arkade-reg07"]
    rust_regtest:
      test: bitboard-ark/tests/preconfirmed_unilateral_exit_proceed_regtest.rs
      name: chained_preconfirmed_proceed_relays_first_step_tx_on_regtest
      run: ARKADE_REGTEST_RUN=1 cargo test -p bitboard-ark --test preconfirmed_unilateral_exit_proceed_regtest -- --ignored --nocapture --test-threads=1
      proves: proceed_unilateral_exit_step relays the first branch tx on Esplora /raw for chained preconfirmed multi-leaf batches (broadcast/bump path; complements E2E automation)
  - id: E2E-ARK-REG-05
    description: Fund on pre-rotation signer, rotate-signer with future cutoff, cooperative migrate via banner, assert no pendingRecoveryDueToExpiredSignerSats or pending-recovery-due-to-expired-signer breakdown
    tags: ["@arkade-signer-regtest"]
  - id: E2E-ARK-REG-06
    description: Fund boarded wallet, ASP changes three getInfo fields, sync shows trust modal, review in autonomous mode with diff table, accept returns to regular mode (ARK-TRUST-03/04/05)
    tags: ["@arkade-operator-trust-regtest"]

infrastructure:
  stack: arkade-regtest
  profile: ark
  esplora: "http://localhost:7030/api"
  arkd: "http://localhost:7070"
  health_gate:
    - scripts/start-arkade-regtest.sh blocks until Esplora + arkd ready
    - Playwright globalSetup when REQUIRE_ARKADE_REGTEST=1
  env_file: ../.env.regtest
