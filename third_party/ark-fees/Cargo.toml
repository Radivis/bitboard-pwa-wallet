[package]
name = "ark-fees"
version = "0.9.3"
edition = "2021"
rust-version = "1.86"
description = "Fee library using CEL for calculating Arkade transaction fees"
license = "MIT"
repository = "https://github.com/arkade-os/rust-sdk"
keywords = ["ark", "arkade", "bitcoin", "wallet"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
cel = "0.12.0"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
