[package]
name = "ark-core"
version = "0.12.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/arkade-os/rust-sdk"
keywords = ["ark", "arkade", "bitcoin", "wallet"]
categories = ["cryptography::cryptocurrencies"]
description = "Core Arkade types and transaction utilities"

[dependencies]
bech32 = "0.11"
bitcoin = { version = "0.32.7", features = ["base64", "rand", "serde"] }
bs58 = "0.5"
hex = "0.4"
musig = { package = "secp256k1", version = "0.33", features = ["serde"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1.37"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["wasm-bindgen", "js"] }
getrandom2 = { package = "getrandom", version = "0.3.1", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3.77", features = ["Window", "Performance"] }

# Upstream constructors and `StreamTransactionData` exceed Clippy's defaults.
# Reshaping them would diverge from ark-core 0.12.0 without a behavior change.
[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
