# Own workspace: the parent Cargo.lock unifies bitcoin-units to 0.1.2, and wasm-pack then fails
# inside bark-wallet 0.7.1 with error[E0599]: no function or associated item named
# `from_sat_per_vb_u32` found for struct `FeeRate` (src/config.rs). bitcoin-units 0.1.2 does not
# have that constructor. This workspace resolves bitcoin-units on its own. Do not vendor bark-wallet.

[package]
name = "bitboard-bark"
version = "0.3.4"
edition = "2024"

[workspace]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Address checks for collaborative exit run in native tests as well as WASM.
bitcoin = "0.32.7"
# VTXO list JSON is built in native tests and in the WASM session.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
bark-wallet = { version = "0.7.1", default-features = false, features = ["wasm-web", "indexed-db"] }
# Public type of Wallet::open / WalletSeed::new_from_mnemonic. Already in the bark graph.
bip39 = "2.0"
# Input selection's fee callback returns anyhow::Result. Already in the bark graph.
anyhow = "1"
async-trait = "0.1"
# Compact Record dump stored on each encrypted bark rail.
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"
# One-time reader for the fingerprint IndexedDB Bark used before the encrypted dump.
indexed-db = "0.4.2"
js-sys = "0.3"
# Offboard action ids. The js feature is required for wasm32.
getrandom = { version = "0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt"] }
# Record-store tests only. The session stays wasm32. No indexed-db.
bark-wallet = { version = "0.7.1", default-features = false }
anyhow = "1"
async-trait = "0.1"
postcard = { version = "1", features = ["use-std"] }
base64 = "0.22"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]
