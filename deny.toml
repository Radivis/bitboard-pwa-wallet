# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# CI runs: cargo deny check advisories (see .github/workflows/audit.yml)

[advisories]
version = 2
ignore = [
    # Transitive via ark-fees → cel 0.12; only bitboard-arkade uses this chain.
    # Informational unmaintained advisory (no known vulnerability). Revisit when
    # ark-fees adopts cel 0.13+ (pastey) on crates.io.
    { id = "RUSTSEC-2024-0436", reason = "transitive paste via ark-fees/cel; bitboard-arkade only; unmaintained INFO advisory" },
]
# Vendored ark crates are 0.12.0 and use secp256k1 0.33 (the yanked 0.32.0-beta.2 pin is gone).
# ark-fees 0.12 still depends on cel 0.12, so RUSTSEC-2024-0436 stays ignored.
