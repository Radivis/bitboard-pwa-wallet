[workspace.package]
version = "0.3.7"

[workspace]
members = [
    "crypto",
    "bitboard-encryption",
    "bitboard-lightning",
    "bitboard-arkade",
    "bitboard-wasm-sleep",
]
# bitboard-bark is its own workspace. See the comment in bitboard-bark/Cargo.toml.
exclude = ["bitboard-bark"]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# esplora-client ignores Builder::timeout on wasm32; we need it for PWA Esplora sync (see third_party patch).
# ark-fees `now()` uses SystemTime, which panics on wasm32-unknown-unknown and aborts session open.
[patch.crates-io]
esplora-client = { path = "third_party/esplora-client" }
ark-client = { path = "third_party/ark-client" }
ark-rest = { path = "third_party/ark-rest" }
ark-bdk-wallet = { path = "third_party/ark-bdk-wallet" }
ark-core = { path = "third_party/ark-core" }
ark-fees = { path = "third_party/ark-fees" }
